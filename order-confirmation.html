<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="order-confirmation.css">
</head>
<body>
    <div class="confirmation-header">
        <div class="confirmation-icon"><i class="fa fa-check"></i></div>
        <h2 class="confirmation-title">Order Confirmed!</h2>
        <p class="confirmation-subtitle">Your order #AWJ-99281 has been placed.</p>
    </div>

    <div style="padding:16px;">
        <div style="background:white; border-radius:12px; padding:20px; border-left:4px solid var(--green);">
            <div style="margin-bottom:15px;">
                <label style="font-size:10px; color:#999; text-transform:uppercase; letter-spacing:1px;">Tracking Number</label>
                <div style="font-weight:700;">AWJ772833190</div>
            </div>
            <div style="margin-bottom:15px;">
                <label style="font-size:10px; color:#999; text-transform:uppercase; letter-spacing:1px;">Estimated Delivery</label>
                <div id="estimated-delivery" style="font-weight:700;">Loading delivery date…</div>
            </div>
            <div>
                <label style="font-size:10px; color:#999; text-transform:uppercase; letter-spacing:1px;">Seller</label>
                <div style="font-weight:700;">Olu's Gems</div>
            </div>
        </div>

        <div style="margin-top:30px; display:flex; flex-direction:column; gap:12px;">
            <button class="primary-btn">Track Order</button>
            <button class="secondary-btn" onclick="window.location.href='homepage.html'">Back to Marketplace</button>
        </div>

        <p style="text-align:center; margin-top:40px; font-size:13px;">
            Need help? <a href="#" style="color:var(--orange); font-weight:600;">Contact Awwja Support</a>
        </p>
    </div>
    <script src="order-confirmation.js"></script>
</body>
</html>
