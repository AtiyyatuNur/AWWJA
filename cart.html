<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Awwja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header class="top-header cart-header">
        <div class="header-left">
            <button class="back-btn" id="cart-back-btn"><i class="fa fa-arrow-left"></i></button>
        </div>
        <h3 class="cart-title">Shopping Cart</h3>
        <div class="header-right-spacer"></div>
    </header>

    <!-- STEP INDICATOR -->
    <div class="checkout-progress">
        <div class="step active">1</div>
        <div class="step-line"></div>
        <div class="step">2</div>
        <div class="step-line"></div>
        <div class="step">3</div>
    </div>

    <main class="cart-container">
        <div class="cart-info-bar">
            <span class="item-count">1 Item</span>
            <button class="clear-all-btn">Clear All</button>
        </div>

        <div id="cart-items">
            <!-- Items will be injected here by cart.js -->
        </div>

        <div class="cart-total-card">
            <span>Total</span>
            <span id="cart-total">₦45,000</span>
        </div>

        <button class="primary-btn" id="proceed-to-checkout-btn">Proceed to Checkout</button>
    </main>

    <nav class="bottom-nav">
        <a href="homepage.html" class="nav-item">
            <i class="fa fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa fa-search"></i>
            <span>Search</span>
        </a>
        <a href="#" class="nav-item nav-stall">
            <div class="stall-icon"><i class="fa fa-store"></i></div>
        </a>
        <a href="cart.html" class="nav-item active">
            <i class="fa fa-shopping-cart"></i>
            <span>Cart</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>
    <script src="cart.js"></script>
</body>
</html>
